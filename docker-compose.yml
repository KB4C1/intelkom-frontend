services:
  frontend:
    build: .
    container_name: intelcom-frontend
    ports:
      - "3000:3000"   # BrowserSync сервер
      - "3001:3001"   # BrowserSync UI (опційно)
    volumes:
      - .:/app                    # монтуємо вихідний код
      - /app/node_modules         # ізолюємо node_modules контейнера
    command: npm run dev
    stdin_open: true
    tty: true

<div
  class="flex flex-col w-full text-white xs:rounded-xl md:rounded-none overflow-hidden relative"
>
  <div
    class="relative w-full [clip-path:polygon(30px_0,_100%_0,_100%_100%,_0_100%,_0_30px)]"
  >
    <img src="@@imgPath" alt="@@title" class="h-[500px] w-full object-cover" />
    <div
      class="absolute inset-0 bg-linear-to-t from-[#004C97] to-transparent pointer-events-none"
    ></div>
  </div>
  <div class="absolute bottom-0 flex flex-col gap-2 p-4">
    <h2 class="font-semibold text-lg md:text-2xl">@@title</h2>
    <span class="font-medium text-sm text-blue-100 md:text-base"
      >@@description</span
    >
  </div>
</div>

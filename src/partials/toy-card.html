<div class="flex flex-col gap-0">
  <img
    src="@@imgPath"
    class="w-full h-[205px] object-cover [clip-path:polygon(30px_0,_100%_0,_100%_100%,_0_100%,_0_30px)]"
    alt="@@title"
    style="object-position: @@styles"
  />
  <div
    style="background-color: @@bgColor"
    class="z-20 w-full text-center text-xl text-white font-semibold py-1"
  >
    @@title
  </div>
</div>

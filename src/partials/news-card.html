<div class="h-[350px] w-full flex flex-col relative overflow-hidden">
  <img
    class="z-10 h-full w-full object-cover object-top [clip-path:polygon(30px_0,_100%_0,_100%_100%,_0_100%,_0_30px)]"
    src="@@imgPath"
    alt="@@title"
  />
  <div
    class="absolute bottom-0 mt-auto z-20 text-white p-6 bg-gradient-to-t from-[#004C97] to-[#004C9700]"
  >
    <h2 class="text-xl font-semibold">@@title</h2>
  </div>
</div>

<header
  data-site-header
  class="max-w-full justify-between h-[64px] md:h-[80px] xl:h-[110] flex flex-row items-center p-4 3xl:px-0 3xl:max-w-[1400px] 3xl:mx-auto bg-[#F7FAFC] border-b border-gray-100 gap-4"
>
  <style>
    header[data-site-header]:has([data-search-box]:not(.hidden))
      [data-main-nav] {
      display: none;
    }
    header[data-site-header]:has([data-search-box]:not(.hidden))
      [data-logo-link] {
      flex: 0 0 auto;
    }
    header[data-site-header]:has([data-search-box]:not(.hidden))
      [data-header-actions] {
      flex: 1 0 auto;
      flex-direction: row-reverse;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    @media (min-width: 768px) {
      header[data-site-header]:has([data-search-box]:not(.hidden))
        [data-header-actions] {
        padding-left: 190px;
      }
    }
    header[data-site-header]:has([data-search-box]:not(.hidden))
      [data-search-open] {
      display: none;
    }
  </style>

  <a
    href="@@webRoot/index.html"
    data-logo-link
    class="flex items-center justify-start transition-all"
  >
    <img
      src="@@webRoot/assets/icons/Logo.svg"
      class="w-31"
      alt="Логотип"
      data-logo
    />
  </a>

  <nav
    class="hidden xl:flex flex-row shrink-0 mx-auto justify-between"
    data-main-nav
    style="gap: 50px"
  >
    <div class="group relative text-black">
      <div class="flex flex-row items-center gap-1 cursor-pointer py-2">
        <a
          href="@@webRoot/about.html"
          class="font-medium text-black transition-colors duration-200 group-hover:text-[#E90B0F] group-hover:underline group-focus-within:text-[#E90B0F] group-focus-within:underline"
          >Компанія</a
        >
      </div>
    </div>

    <div class="group relative text-black">
      <div class="flex flex-row items-center gap-1 cursor-pointer py-2">
        <a
          href="@@webRoot/products/index.html"
          class="font-medium text-black transition-colors duration-200 group-hover:text-[#E90B0F] group-hover:underline group-focus-within:text-[#E90B0F] group-focus-within:underline"
          >Продукція</a
        >
        <img
          src="@@webRoot/assets/icons/ArrowBottom.svg"
          class="h-4 w-4 transition-transform duration-200 group-hover:rotate-180 group-hover:brightness-75 group-focus-within:rotate-180 group-focus-within:brightness-75"
        />
      </div>
      <div
        class="absolute left-0 z-50 pt-2 hidden min-w-[220px] group-hover:block group-focus-within:block"
      >
        <div class="rounded-lg border border-gray-100 bg-white py-2 shadow-xl">
          <div class="flex flex-col">
            <a
              href="@@webRoot/products/toys.html"
              class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#E90B0F] transition-colors"
              >Іграшки «ТехноК»</a
            >
            <a
              href="@@webRoot/products/plastic.html"
              class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#E90B0F] transition-colors"
              >Вироби з пластмаси</a
            >
            <a
              href="@@webRoot/products/metaloobrobka.html"
              class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#E90B0F] transition-colors"
              >Вироби з металу</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="group relative text-black">
      <div class="flex flex-row items-center gap-1 cursor-pointer py-2">
        <a
          href="@@webRoot/services/index.html"
          class="font-medium text-black transition-colors duration-200 group-hover:text-[#E90B0F] group-hover:underline group-focus-within:text-[#E90B0F] group-focus-within:underline"
          >Послуги</a
        >
        <img
          src="@@webRoot/assets/icons/ArrowBottom.svg"
          class="h-4 w-4 transition-transform duration-200 group-hover:rotate-180 group-hover:brightness-75 group-focus-within:rotate-180 group-focus-within:brightness-75"
        />
      </div>
      <div
        class="absolute left-0 z-50 pt-2 hidden min-w-[220px] group-hover:block group-focus-within:block"
      >
        <div class="rounded-lg border border-gray-100 bg-white py-2 shadow-xl">
          <div class="flex flex-col">
            <a
              href="@@webRoot/services/plastic.html"
              class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#E90B0F] transition-colors"
              >Лиття виробів з пластмаси</a
            >
            <a
              href="@@webRoot/services/metaloobrobka.html"
              class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#E90B0F] transition-colors"
              >Металообробка</a
            >
            <a
              href="@@webRoot/services/lyttia-tpa.html"
              class="px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#E90B0F] transition-colors"
              >Промисловий дизайн та проєктування</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="group relative text-black">
      <div class="flex flex-row items-center gap-1 cursor-pointer py-2">
        <a
          href="@@webRoot/cooperation.html"
          class="font-medium text-black transition-colors duration-200 group-hover:text-[#E90B0F] group-hover:underline group-focus-within:text-[#E90B0F] group-focus-within:underline"
          >Співпраця</a
        >
      </div>
    </div>
    <div class="group relative text-black">
      <div class="flex flex-row items-center gap-1 cursor-pointer py-2">
        <a
          href="@@webRoot/news/index.html"
          class="font-medium text-black transition-colors duration-200 group-hover:text-[#E90B0F] group-hover:underline group-focus-within:text-[#E90B0F] group-focus-within:underline"
          >Новини</a
        >
      </div>
    </div>
    <div class="group relative text-black">
      <div class="flex flex-row items-center gap-1 cursor-pointer py-2">
        <a
          href="#footer-contacts"
          class="font-medium text-black transition-colors duration-200 group-hover:text-[#E90B0F] group-hover:underline group-focus-within:text-[#E90B0F] group-focus-within:underline"
          >Контакти</a
        >
      </div>
    </div>
  </nav>

  <div
    class="flex flex-row items-center gap-4 justify-end transition-all duration-300"
    data-header-actions
  >
    <div
      class="hidden min-w-0 flex-1 flex-row items-center gap-2 rounded-md border border-[#004C97] bg-white"
      data-search-box
      style="padding: 9px"
    >
      <img src="@@webRoot/assets/icons/Search.svg" class="w-4" alt="Пошук" />
      <input
        type="text"
        placeholder="що вас цікавить?"
        class="text-black self-stretch w-full outline-none text-sm"
        data-search-input
      />
      <img
        src="@@webRoot/assets/icons/Close2.svg"
        class="w-4 cursor-pointer hover:opacity-70 transition-opacity"
        alt="Закрити"
        data-search-close
      />
    </div>

    <img
      src="@@webRoot/assets/icons/Search.svg"
      class="w-5 h-5 cursor-pointer hover:opacity-80 transition-opacity shrink-0"
      data-search-open
    />

    <img
      src="@@webRoot/assets/icons/LangToggle.svg"
      class="w-6 shrink-0"
      data-lang-toggle
    />
    <img
      src="@@webRoot/assets/icons/MenuIcon.png"
      class="w-5 h-5 xl:hidden cursor-pointer shrink-0"
      alt="Меню"
      data-menu-open
    />
  </div>
</header>

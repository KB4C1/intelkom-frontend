<div class="@@colSpan">
  <div class="relative overflow-hidden inline-block h-[250px] w-full">
    <img
      class="w-full h-full object-cover [clip-path:polygon(30px_0,_100%_0,_100%_100%,_0_100%,_0_30px)]"
      src="@@imgPath"
      alt="@@title"
    />

    <div
      style="background-color: @@bgColor"
      class="absolute bottom-0 left-0 w-full flex flex-col text-center px-5 h-15 justify-center items-center z-20"
    >
      <strong class="font-semibold text-lg text-white">@@title</strong>
    </div>
  </div>
</div>
